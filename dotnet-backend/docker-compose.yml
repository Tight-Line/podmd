services:
  podmd-api:
    build:
      context: .
      dockerfile: src/PodMD.Api/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    env_file:
      - dev.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - podmd-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - dev.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - podmd-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - dev.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - podmd-network

volumes:
  mysql_data:
  minio_data:

networks:
  podmd-network:
    driver: bridge
