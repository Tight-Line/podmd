[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can be provided here so they don't need to be in
# the target system's python environment.
timezone = UTC

# max length of characters to apply to the
# migration file template (used by "alembic init")
# truncate_slug_length = 40

# set to 'true' to run the environment file as a python file.
# The alembic script file will be run directly on the command line
# using 'alembic' command, so don't use this if your script file has
# import errors or other issues
# unsafe_imports = false

# set to 'true' to use the revision number in the filename when
# generating new migration scripts. A revision number will be prefixed
# to the slug in the migration filename.
# revision_environment = false

# Controls how many migrations files are generated
# when running offline mode and no directive is specified
# version_locations = %(here)s/foo/bar/%%(version)s/%%(slug)s

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =

[logger_alembic]
level = INFO
handlers =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
qualname = 

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
